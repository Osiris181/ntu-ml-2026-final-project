[project]
name = "ntu-stock-intraday-direction"
version = "0.1.0"
description = "Shared experiment pipeline for the NTU machine learning final project"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "optuna>=4,<6",
    "pandas",
    "xgboost>=3,<4",
]

[project.optional-dependencies]
e12 = [
    "torch>=2.6,<3",
]

[tool.uv]
package = false
